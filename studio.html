<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre Nuestro Estudio y Filosofía de Diseño | Aferta SG</title>
    <meta name="description" content="Conoce las instalaciones, valores y el equipo técnico detrás de nuestro taller líder en soluciones gráficas y acabados profesionales para negocios.">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header class="header">
        <div class="logo-contenedor">
            <img src="logo.png" alt="Logo" class="mini-logo">
            <span class="logo-texto">URBAN INK</span>
        </div>
        <nav class="nav">
    <a href="index.html">Inicio</a>
    <a href="catalogo.html">Servicios</a>
    <a href="studio.html">Pedidos</a>
    <a href="blog.html">Blog</a>
    <a href="contacto.html">Contacto</a>
</nav>
    </header>

    <main class="seccion-studio">
        <div class="contenedor-formulario">
            <h2 class="titulo-seccion">REALIZA TU PEDIDO URBAN</h2>
            <p class="descripcion-studio">Configura las especificaciones de tu packaging y solicita producción.</p>
            
            <form action="#" method="POST">
                <fieldset class="grupo-formulario">
                    <legend class="leyenda-formulario">Especificaciones del Pedido</legend>
                    
                    <label for="empresa">Nombre o Empresa:</label>
                    <input type="text" name="empresa" id="empresa" placeholder="Ej. Urban Studio" required>
                    
                    <label for="correo">Correo de Contacto:</label>
                    <input type="email" name="correo" id="correo" placeholder="tu@email.com" required>
                    
                    <label for="material">Tipo de Soporte:</label>
                    <input type="text" name="material" id="material" placeholder="Ej. Cartón Kraft o Algodón Orgánico" required>
                    
                    <label for="detalles">Detalles finales (Unidades, tamaños, tintas):</label>
                    <textarea name="detalles" id="detalles" rows="4" placeholder="Quiero 500 cajas con logo dorado..." required></textarea>
                    
                    <button type="submit" class="boton-enviar">SOLICITAR PRODUCCIÓN</button>
                </fieldset>
            </form>
        </div>
    </main>

    <footer class="footer">

    </footer>

</body>
</html>
